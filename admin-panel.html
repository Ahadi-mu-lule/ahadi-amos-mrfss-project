<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakyenga SaaS Admin Panel</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #162233;
      --card: #0f172a;
      --card-2: #111b2d;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5edf7;
      --muted: #9fb2ca;
      --primary: #3b82f6;
      --primary-2:#1d4ed8;
      --success: #10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --purple:#8b5cf6;
      --shadow: 0 18px 50px rgba(2,6,23,0.55);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #12233d, #0b1220 38%);
    }

    .admin-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17,24,39,0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      font-size: 0.72rem;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-user {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15,23,42,0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      background: linear-gradient(135deg, var(--warning), #ea580c);
      color: white;
      font-size: 0.75rem;
    }

    .logout-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(239,68,68,0.10);
      color: #fecaca;
      cursor: pointer;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .stat-card {
      background: rgba(15,23,42,0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 10px;
    }

    .muted { color: var(--muted); }
    .positive { color: var(--success); }
    .warning { color: var(--warning); }
    .danger { color: var(--danger); }
    .purple { color: var(--purple); }

    .content-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 18px;
      margin-top: 22px;
    }

    .panel {
      background: rgba(15,23,42,0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.8);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 1.02rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(59,130,246,0.12);
      color: #bfdbfe;
      border: 1px solid rgba(59,130,246,0.28);
    }

    .list-wrap {
      padding: 12px 16px 16px;
    }

    .list-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .list-table th, .list-table td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(148,163,184,0.12);
      vertical-align: top;
    }

    .list-table th {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .plan-select {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(15,23,42,0.9);
      color: var(--text);
      padding: 7px 8px;
      min-width: 110px;
    }

    .action-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 0.75rem;
      color: white;
      margin-right: 6px;
    }

    .approve { background: linear-gradient(135deg, var(--success), #0f766e); }
    .reject { background: linear-gradient(135deg, var(--danger), #991b1b); }
    .secondary { background: rgba(59,130,246,0.18); color: #bfdbfe; border: 1px solid rgba(59,130,246,0.3); }

    .ticket-list { display: flex; flex-direction: column; gap: 12px; }

    .ticket-item {
      background: rgba(17,24,39,0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .ticket-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ticket-subject {
      font-weight: 700;
      margin: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .chip.open { background: rgba(59,130,246,0.12); color: #bfdbfe; }
    .chip.in_progress { background: rgba(245,158,11,0.12); color: #fcd34d; }
    .chip.resolved { background: rgba(16,185,129,0.12); color: #86efac; }
    .chip.bug_report { background: rgba(239,68,68,0.12); color: #fca5a5; }
    .chip.feature_request { background: rgba(139,92,246,0.12); color: #ddd6fe; }
    .chip.support { background: rgba(59,130,246,0.12); color: #bfdbfe; }

    .ticket-body {
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
      font-size: 0.8rem;
    }

    .reply-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .reply-row input {
      flex: 1;
      background: rgba(15,23,42,0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .reply-row button {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty-state {
      padding: 24px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 1080px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .content-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .admin-shell { padding: 14px; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .stats-grid { grid-template-columns: 1fr; }
      .list-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">BT</div>
        <div>
          <div>Bakyenga SaaS</div>
          <small style="color: var(--muted); font-weight: 600; letter-spacing: 0.06em;">DEVELOPER ADMIN PANEL</small>
        </div>
      </div>

      <div class="header-actions">
        <div class="mini-user">
          <div class="avatar" id="adminAvatar">AA</div>
          <div>
            <div id="adminName" style="font-weight:700;">Developer</div>
            <small id="adminRole" style="color: var(--muted);">System Admin</small>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="stats-grid" id="summaryCards"></div>

    <div class="content-grid">
      <div class="panel">
        <div class="panel-header">
          <h3>Pending Business Registrations</h3>
          <span class="badge" id="pendingCountBadge">0</span>
        </div>
        <div id="pendingRegistrationsList" class="list-wrap"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Support & Bug Reports</h3>
          <span class="badge" id="ticketCountBadge">0</span>
        </div>
        <div class="list-wrap ticket-list" id="ticketList"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:22px;">
      <div class="panel-header">
        <h3>Approved Businesses</h3>
        <span class="badge" id="approvedCountBadge">0</span>
      </div>
      <div class="list-wrap" id="approvedBusinessesList"></div>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    (function () {
      const auth = window.BakyengaAuth;

      function ensureAdmin() {
        const admin = auth.getAdminSession();
        if (!admin) {
          window.location.href = '/login.html';
          return null;
        }

        document.getElementById('adminName').textContent = admin.name;
        document.getElementById('adminRole').textContent = admin.title;
        document.getElementById('adminAvatar').textContent = (admin.name || 'AA').split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
        return admin;
      }

      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      function money(value) {
        return new Intl.NumberFormat('en-US').format(value || 0);
      }

      function renderSummary() {
        const businesses = auth.getAllBusinesses();
        const pending = auth.getPendingRegistrations();
        const tickets = auth.getSupportTickets();
        const active = businesses.filter((b) => b.status === 'approved').length;
        const openTickets = tickets.filter((t) => t.status !== 'resolved').length;

        const cards = [
          { label: 'Total Businesses', value: businesses.length, tone: 'primary' },
          { label: 'Pending Approvals', value: pending.length, tone: 'warning' },
          { label: 'Active Subs', value: active, tone: 'success' },
          { label: 'Open Tickets', value: openTickets, tone: 'danger' },
          { label: 'Monthly Revenue', value: `UGX ${money((businesses.filter((b) => b.subscriptionPlan === 'monthly').length * 50000) + (businesses.filter((b) => b.subscriptionPlan === 'yearly').length * 500000))}`, tone: 'purple' }
        ];

        const container = document.getElementById('summaryCards');
        container.innerHTML = cards.map((card) => `
          <div class="stat-card">
            <div class="stat-label">${card.label}</div>
            <div class="stat-number ${card.tone === 'warning' ? 'warning' : card.tone === 'danger' ? 'danger' : card.tone === 'success' ? 'positive' : card.tone === 'purple' ? 'purple' : ''}">${card.value}</div>
          </div>
        `).join('');
      }

      function renderPendingRegistrations() {
        const pending = auth.getPendingRegistrations();
        const list = document.getElementById('pendingRegistrationsList');
        document.getElementById('pendingCountBadge').textContent = pending.length;

        if (!pending.length) {
          list.innerHTML = '<div class="empty-state">No business registrations pending approval.</div>';
          return;
        }

        list.innerHTML = `
          <table class="list-table">
            <thead>
              <tr>
                <th>Business</th>
                <th>Contact</th>
                <th>Admin</th>
                <th>Plan</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${pending.map((item) => `
                <tr>
                  <td>
                    <strong>${item.businessName}</strong><br>
                    <span class="muted">${item.location}</span>
                  </td>
                  <td>
                    ${item.email}<br>
                    <span class="muted">${item.phone}</span>
                  </td>
                  <td>
                    ${item.adminName}<br>
                    <span class="muted">@${item.adminUsername}</span>
                  </td>
                  <td>
                    <select class="plan-select" data-id="${item.id}">
                      ${Object.entries(auth.SUBSCRIPTION_PLANS).map(([key, plan]) => `<option value="${key}">${plan.name}</option>`).join('')}
                    </select>
                  </td>
                  <td>
                    <button class="action-btn approve" data-action="approve" data-id="${item.id}">Approve</button>
                    <button class="action-btn reject" data-action="reject" data-id="${item.id}">Reject</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function renderApprovedBusinesses() {
        const businesses = auth.getAllBusinesses().filter((b) => b.status === 'approved');
        const list = document.getElementById('approvedBusinessesList');
        document.getElementById('approvedCountBadge').textContent = businesses.length;

        if (!businesses.length) {
          list.innerHTML = '<div class="empty-state">No approved businesses yet.</div>';
          return;
        }

        list.innerHTML = `
          <table class="list-table">
            <thead>
              <tr>
                <th>Business</th>
                <th>Plan</th>
                <th>Admin</th>
                <th>Contact</th>
                <th>Expiry</th>
              </tr>
            </thead>
            <tbody>
              ${businesses.map((b) => `
                <tr>
                  <td>
                    <strong>${b.name}</strong><br>
                    <span class="muted">${b.location}</span>
                  </td>
                  <td>
                    <span class="chip ${b.subscriptionPlan}">${auth.SUBSCRIPTION_PLANS[b.subscriptionPlan]?.name || b.subscriptionPlan}</span>
                  </td>
                  <td>
                    ${b.admin.name}<br>
                    <span class="muted">@${b.admin.username}</span>
                  </td>
                  <td>
                    ${b.email}<br>
                    <span class="muted">${b.phone}</span>
                  </td>
                  <td>${formatDate(b.subscriptionEndDate)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function renderTickets() {
        const tickets = auth.getSupportTickets();
        const container = document.getElementById('ticketList');
        document.getElementById('ticketCountBadge').textContent = tickets.length;

        if (!tickets.length) {
          container.innerHTML = '<div class="empty-state">No support tickets or bug reports yet.</div>';
          return;
        }

        container.innerHTML = tickets.map((ticket) => `
          <div class="ticket-item">
            <div class="ticket-title">
              <div>
                <p class="ticket-subject">${ticket.subject}</p>
                <small class="muted">${ticket.businessId} • ${formatDate(ticket.createdDate)}</small>
              </div>
              <span class="chip ${ticket.status}">${ticket.status.replace('_', ' ')}</span>
            </div>
            <div class="ticket-body">${ticket.message}</div>
            <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
              <span class="chip ${ticket.category}">${ticket.category.replace('_', ' ')}</span>
              <span class="chip">Priority: ${ticket.priority}</span>
            </div>
            <div class="reply-row">
              <input type="text" placeholder="Reply to customer" data-ticket-id="${ticket.id}" />
              <button data-ticket-id="${ticket.id}" data-action="reply">Send</button>
            </div>
          </div>
        `).join('');
      }

      function handleAction(event) {
        const target = event.target;
        const action = target.dataset.action;
        const id = target.dataset.id;

        if (!action || !id) return;

        if (action === 'approve') {
          const select = document.querySelector(`select[data-id="${id}"]`);
          const plan = select ? select.value : 'free_trial';
          const business = auth.approveBusiness(id, plan);

          if (business) {
            alert(`Business approved: ${business.name}. Credentials can be sent to ${business.email}.`);
            renderAll();
          }
        }

        if (action === 'reject') {
          const reason = prompt('Reason for rejection:', 'Application does not meet requirements');
          auth.rejectBusiness(id, reason || 'No reason provided');
          renderAll();
        }

        if (action === 'reply') {
          const input = document.querySelector(`input[data-ticket-id="${id}"]`);
          const value = input ? input.value.trim() : '';
          if (!value) {
            alert('Please enter a reply first.');
            return;
          }
          auth.respondToTicket(id, value, 'resolved');
          renderAll();
        }
      }

      function renderAll() {
        renderSummary();
        renderPendingRegistrations();
        renderApprovedBusinesses();
        renderTickets();
      }

      document.addEventListener('click', handleAction);
      document.getElementById('logoutBtn').addEventListener('click', () => {
        auth.clearAdminSession();
        window.location.href = '/login.html';
      });

      ensureAdmin();
      renderAll();
    })();
  </script>
</body>
</html>
